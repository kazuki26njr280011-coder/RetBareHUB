<!doctype html>
<html lang="ja" data-page="profile">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>retbareHUB | プロフィール</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="ambient-bg" aria-hidden="true"></div>

  <header class="site-header">
    <a class="brand" href="./index.html">
      <span class="brand-cube">rH</span>
      <span>
        <strong>retbareHUB</strong>
        <small>retbare fan site</small>
      </span>
    </a>

    <nav class="site-nav" aria-label="メインナビ">
      <a href="./index.html" data-page="home">ホーム</a>
      <a href="./news.html" data-page="news">お知らせ</a>
      <a href="./quest.html" data-page="quest">クエスト</a>
      <a href="./profile.html" data-page="profile">プロフィール</a>
      <a href="./rules.html" data-page="rules">ニュース/ルール</a>
    </nav>

    <div class="header-status">
      <span id="currentMcidPill">MCID未設定</span>
      <span id="pointPill">0P</span>
    </div>
  </header>

  <main class="page-shell">
    <section class="page-intro">
      <p class="eyebrow">Retbare Profile</p>
      <h1>プロフィール</h1>
      <p>MCIDを入れると、スキン顔・コメント・タイトル・エフェクト・曲を表示します。</p>
    </section>

    <section class="profile-search soft-card">
      <label for="mcidInput">MCID</label>
      <div class="search-line">
        <input id="mcidInput" type="text" placeholder="例: Retaru46" maxlength="16" autocomplete="off">
        <button id="loadProfileBtn" class="hub-button">開く</button>
      </div>
      <p class="hint">入力したMCIDはこのブラウザに保存されます。亀クリック時のPoint受け取りにも使います。</p>
    </section>

    <section id="profileCard" class="profile-card empty">
      <p>上の入力欄からプロフィールを開いてね。</p>
    </section>

    <section id="profileEditor" class="soft-card profile-editor" hidden></section>

    <section class="section-block">
      <div class="section-title">
        <span>Shop</span>
        <h2>RetbareHubPoint ショップ</h2>
      </div>
      <div id="profileShop" class="shop-grid"></div>
    </section>

    <audio id="profileAudio" preload="auto"></audio>
  </main>

  <footer class="site-footer">
    <span>retbareHUB</span>
    <span>Profile room</span>
  </footer>

  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-storage-compat.js"></script>
  <script src="./firebase.js"></script>
  <script src="./app.js"></script>
</body>
</html>
