<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quest | RetBareHUB</title>
  <link rel="stylesheet" href="./style.css?v=20" />
  <script defer src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.12.5/firebase-storage-compat.js"></script>
  <script defer src="./firebase.js?v=20"></script>
  <script defer src="./items.js?v=20"></script>
  <script defer src="./app.js?v=20"></script>
</head>
<body data-page="quest">
  <div class="site-bg"><div class="bg-orb one"></div><div class="bg-orb two"></div><div class="bg-orb three"></div></div>

  <header class="topbar">
    <a class="brand" href="./index.html"><span class="brand-mark">R</span><span>RetBareHUB<small>Quest</small></span></a>
    <nav class="nav">
      <a class="nav-link" href="./index.html">Home</a>
      <a class="nav-link" href="./news.html">News</a>
      <a class="nav-link active" href="./quest.html">Quest</a>
      <a class="nav-link" href="./profile.html">Profile</a>
      <a class="nav-link" href="./chat.html">Chat</a>
      <a class="nav-link" href="./rules.html">Rules</a>
    </nav>
    <div id="miniAccount" class="mini-account"></div>
  </header>

  <main class="wrap">
    <section class="hero">
      <div>
        <div class="kicker">Retbare Mission Board</div>
        <h1>Quest</h1>
        <p>クエストを達成してRetbareHubPointを集めよう。追加はretaru46専用。</p>
      </div>
    </section>

    <section id="questAdminPanel" class="panel" hidden>
      <div class="panel-title"><div><h2>クエスト追加</h2><p>retaru46専用</p></div></div>
      <form id="questForm" class="form">
        <input id="questTitle" class="input" placeholder="クエスト名" />
        <input id="questReward" class="input" type="number" placeholder="報酬ポイント" />
        <textarea id="questBody" class="textarea" placeholder="説明"></textarea>
        <button class="btn" type="submit">追加</button>
      </form>
    </section>

    <section class="panel">
      <div class="panel-title"><div><h2>クエスト一覧</h2><p>Firestoreから読み込み</p></div></div>
      <div id="questList" class="quest-list"></div>
    </section>
  </main>

  <div id="modalRoot" class="modal-root"></div>
  <div id="toastRoot" class="toast-root"></div>
  <div id="turtleRoot" class="turtle-root"></div>
</body>
</html>
