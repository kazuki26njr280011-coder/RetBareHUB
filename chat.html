<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RetBareChat | RetBareHUB</title>
  <link rel="stylesheet" href="./style.css?v=20" />
  <script defer src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.12.5/firebase-storage-compat.js"></script>
  <script defer src="./firebase.js?v=20"></script>
  <script defer src="./items.js?v=20"></script>
  <script defer src="./app.js?v=20"></script>
</head>
<body data-page="chat">
  <div class="site-bg"><div class="bg-orb one"></div><div class="bg-orb two"></div><div class="bg-orb three"></div></div>

  <header class="topbar">
    <a class="brand" href="./index.html"><span class="brand-mark">R</span><span>RetBareHUB<small>Chat</small></span></a>
    <nav class="nav">
      <a class="nav-link" href="./index.html">Home</a>
      <a class="nav-link" href="./news.html">News</a>
      <a class="nav-link" href="./quest.html">Quest</a>
      <a class="nav-link" href="./profile.html">Profile</a>
      <a class="nav-link active" href="./chat.html">Chat</a>
      <a class="nav-link" href="./rules.html">Rules</a>
    </nav>
    <div id="miniAccount" class="mini-account"></div>
  </header>

  <main class="wrap">
    <section class="hero">
      <div>
        <div class="kicker">RetBareChat</div>
        <h1>Chat</h1>
        <p>LINEっぽくスレッドを立てて話せる場所。投稿にはログインが必要です。画像投稿はFirebase有料プランが必要なので今はテキストのみ。</p>
      </div>
    </section>

    <section class="panel chat-layout">
      <aside>
        <div class="panel-title"><div><h2>スレッド</h2><p>新しく立てられます</p></div></div>
        <form id="threadForm" class="form">
          <input id="threadTitle" class="input" placeholder="スレタイトル" />
          <textarea id="threadBody" class="textarea" placeholder="最初の本文"></textarea>
          <button class="btn" type="submit">スレ立て</button>
        </form>
        <div id="threadList" class="thread-list" style="margin-top:16px"></div>
      </aside>

      <section class="chat-window">
        <div class="panel-title">
          <div>
            <h2 id="activeThreadTitle">スレッドを選んでね</h2>
            <p id="activeThreadMeta">ログインすると投稿できます。</p>
          </div>
        </div>
        <div id="messages" class="messages"></div>
        <form id="messageForm" class="form-row" style="margin-top:14px">
          <input id="messageInput" class="input" placeholder="メッセージを書く" />
          <button class="btn" type="submit">送信</button>
        </form>
      </section>
    </section>
  </main>

  <div id="modalRoot" class="modal-root"></div>
  <div id="toastRoot" class="toast-root"></div>
  <div id="turtleRoot" class="turtle-root"></div>
</body>
</html>
